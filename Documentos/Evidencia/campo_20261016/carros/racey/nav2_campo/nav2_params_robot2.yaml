robot2:
  amcl:
    ros__parameters:
      alpha1: 0.2
      alpha2: 0.2
      alpha3: 0.2
      alpha4: 0.2
      alpha5: 0.2
      base_frame_id: base_link
      beam_skip_distance: 0.5
      beam_skip_error_threshold: 0.9
      beam_skip_threshold: 0.3
      do_beamskip: false
      global_frame_id: map
      initial_pose:
        x: 0.0
        y: 0.0
        yaw: 0.0
        z: 0.0
      lambda_short: 0.1
      laser_likelihood_max_dist: 2.0
      laser_max_range: 100.0
      laser_min_range: -1.0
      laser_model_type: likelihood_field
      max_beams: 60
      max_particles: 2000
      min_particles: 500
      odom_frame_id: odom
      pf_err: 0.05
      pf_z: 0.99
      recovery_alpha_fast: 0.0
      recovery_alpha_slow: 0.0
      resample_interval: 1
      robot_model_type: nav2_amcl::DifferentialMotionModel
      save_pose_rate: 0.5
      scan_topic: scan
      set_initial_pose: true
      sigma_hit: 0.2
      tf_broadcast: true
      transform_tolerance: 1.0
      update_min_a: 0.2
      update_min_d: 0.25
      use_sim_time: true
      z_hit: 0.5
      z_max: 0.05
      z_rand: 0.5
      z_short: 0.05
  amcl_map_client:
    ros__parameters:
      use_sim_time: true
  amcl_rclcpp_node:
    ros__parameters:
      use_sim_time: true
  behavior_server:
    ros__parameters:
      backup:
        plugin: nav2_behaviors::BackUp
      behavior_plugins:
      - spin
      - backup
      - wait
      cycle_frequency: 10.0
      global_frame: map
      local_costmap_topic: local_costmap/costmap_raw
      local_footprint_topic: local_costmap/published_footprint
      local_frame: odom
      max_rotational_vel: 1.0
      min_rotational_vel: 0.4
      robot_base_frame: base_link
      rotational_acc_lim: 3.2
      simulate_ahead_time: 2.0
      spin:
        plugin: nav2_behaviors::Spin
      transform_timeout: 0.1
      use_sim_time: true
      wait:
        plugin: nav2_behaviors::Wait
  bt_navigator:
    ros__parameters:
      default_nav_through_poses_bt_xml: ''
      default_nav_to_pose_bt_xml: ''
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: true
  bt_navigator_rclcpp_node:
    ros__parameters:
      use_sim_time: true
  controller_server:
    ros__parameters:
      FollowPath:
        allow_reversing: true
        approach_velocity_scaling_dist: 0.6
        cost_scaling_dist: 0.3
        cost_scaling_gain: 1.0
        desired_linear_vel: 0.5
        inflation_cost_scaling_factor: 3.0
        lookahead_dist: 0.6
        lookahead_time: 1.5
        max_allowed_time_to_collision_up_to_carrot: 1.0
        max_lookahead_dist: 0.9
        min_approach_linear_velocity: 0.05
        min_lookahead_dist: 0.3
        plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
        regulated_linear_scaling_min_radius: 0.9
        regulated_linear_scaling_min_speed: 0.25
        transform_tolerance: 0.1
        use_collision_detection: true
        use_cost_regulated_linear_velocity_scaling: false
        use_regulated_linear_velocity_scaling: true
        use_rotate_to_heading: false
        use_velocity_scaled_lookahead_dist: false
      controller_frequency: 20.0
      controller_plugins:
      - FollowPath
      goal_checker:
        plugin: nav2_controller::SimpleGoalChecker
        stateful: false
        xy_goal_tolerance: 0.25
        yaw_goal_tolerance: 3.15
      goal_checker_plugin: goal_checker
      min_theta_velocity_threshold: 0.001
      min_x_velocity_threshold: 0.001
      min_y_velocity_threshold: 0.5
      progress_checker:
        movement_time_allowance: 10.0
        plugin: nav2_controller::SimpleProgressChecker
        required_movement_radius: 0.5
      progress_checker_plugins:
      - progress_checker
      use_sim_time: true
  controller_server_rclcpp_node:
    ros__parameters:
      use_sim_time: true
  global_costmap:
    global_costmap:
      ros__parameters:
        always_send_full_costmap: true
        footprint: '[[0.140, 0.095], [0.140, -0.095], [-0.140, -0.095], [-0.140, 0.095]]'
        global_frame: map
        inflation_layer:
          cost_scaling_factor: 3.0
          inflation_radius: 0.55
          plugin: nav2_costmap_2d::InflationLayer
        obstacle_layer:
          enabled: true
          observation_sources: scan
          plugin: nav2_costmap_2d::ObstacleLayer
          scan:
            clearing: true
            data_type: LaserScan
            marking: true
            max_obstacle_height: 2.0
            obstacle_max_range: 2.0
            obstacle_min_range: 0.0
            raytrace_max_range: 2.5
            raytrace_min_range: 0.0
            topic: /scan
        plugins:
        - static_layer
        - obstacle_layer
        - inflation_layer
        publish_frequency: 1.0
        resolution: 0.06
        robot_base_frame: base_link
        track_unknown_space: true
        update_frequency: 1.0
        use_sim_time: true
    global_costmap_client:
      ros__parameters:
        use_sim_time: true
    global_costmap_rclcpp_node:
      ros__parameters:
        use_sim_time: true
  local_costmap:
    local_costmap:
      ros__parameters:
        always_send_full_costmap: true
        footprint: '[[0.140, 0.095], [0.140, -0.095], [-0.140, -0.095], [-0.140, 0.095]]'
        global_frame: odom
        height: 3
        inflation_layer:
          cost_scaling_factor: 3.0
          inflation_radius: 0.55
          plugin: nav2_costmap_2d::InflationLayer
        plugins:
        - voxel_layer
        - inflation_layer
        publish_frequency: 2.0
        resolution: 0.05
        robot_base_frame: base_link
        rolling_window: true
        static_layer:
          map_subscribe_transient_local: true
        update_frequency: 5.0
        use_sim_time: true
        voxel_layer:
          enabled: true
          mark_threshold: 0
          max_obstacle_height: 2.0
          observation_sources: scan
          origin_z: 0.0
          plugin: nav2_costmap_2d::VoxelLayer
          publish_voxel_map: true
          scan:
            clearing: true
            data_type: LaserScan
            marking: true
            max_obstacle_height: 2.0
            obstacle_max_range: 1.5
            obstacle_min_range: 0.0
            raytrace_max_range: 2.0
            raytrace_min_range: 0.0
            topic: /scan
          z_resolution: 0.05
          z_voxels: 16
        width: 3
    local_costmap_client:
      ros__parameters:
        use_sim_time: true
    local_costmap_rclcpp_node:
      ros__parameters:
        use_sim_time: true
  map_server:
    ros__parameters:
      frame_id: map
      use_sim_time: true
      yaml_filename: primer_piso_definitivo.yaml
  planner_server:
    ros__parameters:
      GridBased:
        allow_unknown: false
        angle_quantization_bins: 72
        change_penalty: 0.2
        cost_penalty: 1.3
        downsample_costmap: false
        downsampling_factor: 1
        max_iterations: -1
        max_on_approach_iterations: 1000
        max_planning_time: 2.0
        minimum_turning_radius: 0.35
        motion_model_for_search: REEDS_SHEPP
        non_straight_penalty: 1.05
        plugin: nav2_smac_planner::SmacPlannerHybrid
        reverse_penalty: 2.1
        smooth_path: false
        smoother:
          optimizer:
            advanced:
              line_search_sufficient_function_decrease: 1.0e-20
              max_line_search_step_expansion: 50
              max_num_line_search_direction_restarts: 10
              max_num_line_search_step_size_iterations: 50
              min_line_search_step_size: 1.0e-20
            debug_optimizer: false
            fn_tol: 1.0e-20
            gradient_tol: 1.0e-10
            max_iterations: 500
            max_time: 0.1
            param_tol: 1.0e-15
          smoother:
            cost_scaling_factor: 10.0
            w_cost: 0.025
            w_curve: 30.0
            w_dist: 0.0
            w_smooth: 30000.0
        tolerance: 0.5
      planner_plugins:
      - GridBased
      use_sim_time: true
  planner_server_rclcpp_node:
    ros__parameters:
      use_sim_time: true
  robot_state_publisher:
    ros__parameters:
      use_sim_time: true
  waypoint_follower:
    ros__parameters:
      loop_rate: 20
      stop_on_failure: false
      wait_at_waypoint:
        enabled: true
        plugin: nav2_waypoint_follower::WaitAtWaypoint
        waypoint_pause_duration: 200
      waypoint_task_executor_plugin: wait_at_waypoint

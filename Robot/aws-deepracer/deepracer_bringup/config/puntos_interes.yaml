# Localizaciones de interes del entorno de evaluacion. Los quince destinos del
# piso 1, mas el punto de transferencia del piso 2.
#
# POR QUE EXISTE
# --------------
# El contrato de interfaces (Documentos/CONTRATO_INTERFACES.md, seccion 5) hace
# de este archivo la fuente de verdad de los destinos: el coordinador lo carga y
# lo republica latched en /coordinacion/puntos_interes, y la HRI arma sus dos
# listas desplegables -origen y destino- desde ahi. Ningun destino se escribe en
# codigo, y cambiar un nombre no obliga a recompilar.
#
# DE DONDE SALEN LAS COORDENADAS
# ------------------------------
# No estan medidas a ojo sobre RViz. Cada destino es una puerta del pasillo del
# piso 1, y las puertas no se leyeron del SDF una por una: se detectaron sobre
# el mapa (maps/mundo_definitivo_piso1.pgm) como los huecos por donde el espacio
# libre toca lo desconocido. Eso encontro dieciseis vanos. Quince son destinos;
# el decimosexto -pared sur, x = +8.65- se descarto a mano por no corresponder a
# ninguna dependencia real.
#
# El dibujo con los dieciseis marcados esta en Documentos/mapa_destinos.txt.
# Sirve para volver a mirar cual es cual sin tener que abrir Gazebo.
#
# MARCO
# -----
# Todas las poses van en el marco <ns>/map, y ahi coinciden numericamente con las
# coordenadas del mundo de Gazebo. No hay desplazamiento que aplicar entre un
# marco y el otro, y no lo habria aunque cambiase el origen del .yaml del mapa:
# ese campo dice donde cae la esquina de la IMAGEN, no donde esta el marco. Aqui
# estuvo escrito que el origen era [-20.72, 4.62] "que es la esquina de la region
# con la que se genero"; desde el 2026-08-24 el mapa se genera sin regiones y el
# origen es [-21.7245, 3.6174], sin que ninguna pose de este archivo cambie.
#
# DONDE SE DETIENE EL ROBOT, Y POR QUE AHI
# ----------------------------------------
# El robot no atraviesa las puertas: se detiene AL LADO y la HRI dice de que lado
# queda el destino. Eso fija dos cosas.
#
# La primera es el yaw. Va alineado con el pasillo, nunca apuntando a la puerta:
# el vehiculo no puede girar sobre su eje -por eso se quito <Spin> del arbol de
# comportamiento- asi que un destino con yaw perpendicular convertiria cada
# llegada en una maniobra, con su tiempo y su probabilidad de fallo metidos
# dentro de las metricas de OE4. En el pasillo largo eso es yaw = 0, mirando al
# este. En el tramo norte-sur del extremo oeste es yaw = -pi/2, mirando al sur,
# porque ese tramo solo comunica con el pasillo por su extremo norte y a sus dos
# puertas se llega bajando.
#
# ESE RAZONAMIENTO ERA CORRECTO Y AUN ASI INSUFICIENTE, y el 2026-08-24 costo una
# mision. Alinear el yaw con el pasillo evita la maniobra de quien llega DE
# FRENTE, pero no dice nada de quien llega POR DETRAS. Una mision de ETM10 a ETM1
# recorre el pasillo hacia el OESTE y termina en un punto que pide mirar al ESTE:
# 180 grados. El vehiculo hizo el medio giro, y como no gira sobre su eje la
# maniobra lo aparto del punto -de menos de 0.25 m a 0.413 m- mientras Nav2, con
# 'stateful: True', ya solo comprobaba el rumbo. Devolvio SUCCEEDED y el
# coordinador lo rechazo contra /odom. Con quince destinos en linea recta, la
# mitad de los pares origen-destino se recorren en el sentido "equivocado": no era
# un caso raro, era la mitad de los casos.
#
# ASI QUE EL YAW DE ESTE ARCHIVO YA NO SE EXIGE. En
# nav2_params_nav_amcl_sim_demo.yaml el 'yaw_goal_tolerance' paso a 3.15 (~pi), o
# sea que cualquier rumbo final se acepta, y el robot queda apuntando hacia donde
# lo dejo la ruta. Para guiar a una persona eso es lo util: importa llegar al
# sitio, no aparcar en una direccion concreta.
#
# El campo se conserva -no se pone a cero ni se borra- por tres razones: es la
# orientacion con la que se derivaron y se dibujaron las paradas, sigue siendo el
# rumbo natural de aproximacion de frente, y el dia que la HRI quiera decir "el
# destino queda a su izquierda" lo hara con esto y con lado_pared. Pero hoy es
# ORIENTATIVO: nadie lo comprueba. Quien lo lea buscando una garantia de como
# quedara aparcado el vehiculo, no la encontrara aqui.
#
# La segunda es la posicion transversal. La parada conserva la abscisa del vano y
# se aparta del eje del pasillo HACIA LA PARED DE SU PROPIA PUERTA, hasta el
# primer punto con 0.70 m de holgura. No es cosmetico: la regla obvia -pararse en
# el punto mas despejado cerca del vano- pone las dos puertas enfrentadas en el
# mismo sitio, porque el punto mas despejado de un pasillo es su eje y las dos lo
# comparten. Con ella, ETM13 y ETM3 salian a 0.18 m uno de otro; la
# xy_goal_tolerance de Nav2 es 0.25 m, o sea que eran el mismo destino para el
# planificador y la HRI habria ofrecido dos nombres que llevan al mismo punto.
# Arrimadas cada una a su pared quedan a 1.22 m, y la pareja mas junta de todo el
# archivo -Escaleras y Representacion, enfrentadas en el tramo norte-sur- queda a
# 0.54 m, por encima del doble de la tolerancia.
#
# EL CAMPO lado_pared
# -------------------
# Nombra la pared en la que esta la puerta, y es lo que le permite al coordinador
# redactar la frase de la HRI: con la pared y el rumbo de llegada sale si el
# destino queda a la izquierda o a la derecha. Con las cuatro puertas del mundo
# anterior no hacia falta, porque todas estaban en la misma pared y bastaba el
# sentido de marcha; aqui hay puertas en las dos, y sin este campo la frase no se
# puede escribir.
#
# Toma cinco valores: norte, sur, oeste, este y fondo. 'fondo' es el caso de
# ETM10, cuyo vano esta en el muro del extremo este del pasillo: no se pasa por
# al lado, se llega de frente, y ahi la izquierda y la derecha no aplican.
#
# Todavia NO esta en PuntoInteres.msg; entra al contrato en el corte de la
# semana. Un consumidor que no lo conozca puede ignorarlo sin romperse.
#
# HOLGURA
# -------
# Es la distancia de la parada al obstaculo mas cercano del mapa, medida por
# transformada de distancia sobre el .pgm. Para comparar: la huella del vehiculo
# es 0.28 x 0.19 m, o sea 0.17 m de radio letal, y el inflation_radius de 0.55 m
# no es letal -solo encarece el paso-.
#
# LAS CIFRAS BAJARON EL 2026-08-24, y no porque se moviera ninguna parada. Ese
# dia se tapiaron los dieciseis vanos del piso 1 con paneles sinteticos, porque
# mientras estuvieron abiertos el relleno del generador de mapas se escapaba por
# ellos y Nav2 trazaba rutas por un vestibulo fantasma de 38 m fuera del
# edificio. Al tapiarlos, el obstaculo mas cercano a cada parada dejo de ser la
# jamba del vano y paso a ser el panel que tiene delante, a medio metro.
#
# El rango es ahora de 0.48 a 1.14 m. Once de las quince paradas quedan DENTRO
# del inflado, cosa que la version anterior de este parrafo negaba. Ninguna
# queda dentro del radio letal de 0.17 m -la mas apretada esta a 2.8 veces esa
# distancia- asi que las quince siguen siendo objetivos validos: el inflado
# encarece el paso, no lo prohibe. Pero encarecerlo tiene efecto sobre el Smac,
# que lleva cost_penalty 1.3.
#
# LO QUE FALTA DECIDIR. La regla escrita mas arriba -apartarse hacia la pared de
# la propia puerta hasta el primer punto con 0.70 m de holgura- se derivo sobre
# el mapa CON los vanos abiertos, y las poses de abajo ya no la cumplen. La
# regla sigue siendo satisfacible: el pasillo mide 2.14 m, luego 0.70 m de la
# pared norte es y = 10.41 en vez de 10.59, y 0.70 m de la sur es y = 9.67 en
# vez de 9.51. Con esas poses la pareja mas junta -ETM13 y ETM3, enfrentadas-
# quedaria a 0.93 m, todavia por encima del doble de la xy_goal_tolerance.
# Rederivarlas seria OBEDECER la regla, no cambiarla, pero mueve quince destinos
# de un archivo que el contrato declara fuente de verdad, asi que no se hace sin
# decidirlo. Mientras tanto, las poses son las de siempre y las holguras las
# medidas de verdad.
#
# LO QUE FALTA
# ------------
# Del piso 2 esta solo su punto de transferencia, al final de este archivo. El
# piso 2 tiene MAPA desde el 2026-08-23: maps/mundo_definitivo_piso2.{pgm,yaml},
# generado contra mundo_definitivo_piso2.world y ACEPTADO por
# herramientas/verificar_mapa.py. La receta esta escrita dentro de ese .yaml,
# como la del piso 1.
#
# Ese mapa se rehizo el 2026-08-24. Tenia el mismo defecto que el del piso 1: el
# relleno se escapaba por los vanos y se tapaba con cinco --region, que recortan
# el resultado sin cerrar el mundo. Ahora los vanos estan sellados en el .world
# con 23 paneles Limite_p2_* y el mapa se genera SIN --region. Los vanos reales
# resultaron 27, no dieciocho como decia esta nota: el recuento viejo se hizo
# emparejando cada punta con su vecino MAS CERCANO, y eso oculta todo empalme en
# T -entre ellos la boca oeste del pasillo, 2,39 m, cuyo sellado habria dejado a
# robot2 encerrado en su ala-. Cifras actuales: 0 de 7977 obstaculos sin pared
# real y 0 celdas de frontera libre/desconocido de 40 573 libres, que es lo que
# certifica que el mundo esta cerrado. El detalle esta en herramientas/
# buscar_vanos.py y en la cabecera de mundo_definitivo_piso2/model.sdf.
#
# Los NOMBRES de las salas del piso 2 los dio el autor el 2026-08-25, y con
# ellos los dieciseis destinos ya estan escritos abajo. El recorrido con el que
# se dictaron -desde la escalera, ida por la pared norte de oeste a este y
# vuelta por la sur- es el que fija cual es cual, y esta reproducido en el orden
# de las entradas y en la tabla de la seccion PISO 2 de
# Documentos/mapa_destinos.txt. Eran dieciocho vanos: el 1 es la escalera y el I
# mide 0.36 m, por donde el vehiculo no cabe.
#
# Con esto queda cubierta la condicion B de la campana de OE4 (seccion 10 de
# Documentos/PROTOCOLO_EXPERIMENTAL.md), que los tenia como prerrequisito.
#
# DOS DESVIACIONES DE LA REGLA, DECIDIDAS EL 2026-08-25
# ----------------------------------------------------
# La regla de arriba -conservar la abscisa del vano y arrimarse a la pared
# propia hasta 0.70 m de holgura- no se puede cumplir entera en dos puertas,
# porque las dos estan en esquina, con una pared perpendicular a unos 0.3 m de
# la abscisa de su vano:
#
#   Lab. Sistemas 313  conservando la abscisa, el primer punto con 0.70 m cae a
#                      3 m de la puerta, ya en el pasillo principal.
#   IEEE               conservando la abscisa es imposible: la holgura maxima
#                      es 0.26 m, por debajo del minimo de 0.284 m que exige
#                      herramientas/verificar_pose_spawn.py.
#
# En las dos se conserva la HOLGURA y se cede la abscisa, que es lo contrario de
# lo que hacen las otras catorce: la parada es el punto libre mas cercano al
# vano con 0.70 m. Queda a 0.86 m de la puerta en Lab. Sistemas 313 y a 1.02 m
# en IEEE. Se eligio asi porque la holgura protege al vehiculo y la abscisa solo
# separa destinos, y aqui no hay ningun destino enfrentado del que separarse.
#
# LA PAREJA MAS JUNTA DEL PISO 2 QUEDA A 0.38 m
# ---------------------------------------------
# Aula 307 y Sala de Docentes. Esta por encima de la xy_goal_tolerance de 0.25 m
# -el planificador las distingue- pero por debajo de su doble, que es el liston
# que usa el resto de este archivo. No es una parada mal puesta: ahi el pasillo
# se estrecha a 1.80 m, y con 0.70 m de holgura a cada lado no quedan mas que
# 0.40 m entre paradas. Separarlas mas exige bajar la holgura, y se decidio no
# hacerlo. Si alguna vez se ve que la HRI las confunde, ese es el precio a
# revisar, no la geometria.
#
# Los nombres ETM van del 1 al 13 sin ETM12: no es un olvido de numeracion, es
# que ese vano no existe en la planta.
#
# FORMATO
# -------
# Lista YAML plana, no un archivo de parametros de ROS 2: los parametros no
# admiten arreglos de diccionarios sin aplanarlos a mano, y aplanarlos haria
# ilegible justo lo que la HRI tiene que leer. El coordinador lo abre con
# yaml.safe_load. La pose va como x, y, yaw en radianes; convertir yaw a
# cuaternion para geometry_msgs/Pose es trabajo del coordinador, no de este
# archivo.

puntos:

  # ------------------------------------------------- TRAMO NORTE-SUR (oeste) --
  # Dos puertas enfrentadas al fondo de este tramo. Se llega bajando desde el
  # pasillo, luego yaw = -pi/2: Escaleras queda a la derecha y Representacion a
  # la izquierda.

  - id: piso1_escalera
    nombre: "Escaleras"
    nivel: 1
    es_transferencia: true
    lado_pared: oeste        # vano de 0.78 m, centro en y = +5.19
    pose: {x: -19.43, y: 5.91, yaw: -1.5708}
    holgura_m: 1.14

  - id: piso1_representacion
    nombre: "Representación"
    nivel: 1
    es_transferencia: false
    lado_pared: este         # vano de 0.90 m, centro en y = +5.07
    pose: {x: -18.89, y: 5.91, yaw: -1.5708}
    holgura_m: 1.14

  # ------------------------------------------------------------ PASILLO LARGO --
  # De oeste a este. Todas con yaw = 0, alineadas con el pasillo.

  - id: piso1_etm1
    nombre: "ETM1"
    nivel: 1
    es_transferencia: false
    lado_pared: norte        # vano de 0.60 m
    pose: {x: -15.92, y: 10.59, yaw: 0.0}
    holgura_m: 0.54

  - id: piso1_etm2
    nombre: "ETM2"
    nivel: 1
    es_transferencia: false
    lado_pared: norte        # vano de 0.66 m
    pose: {x: -14.75, y: 10.59, yaw: 0.0}
    holgura_m: 0.48

  - id: piso1_etm13
    nombre: "ETM13"
    nivel: 1
    es_transferencia: false
    lado_pared: sur          # vano de 1.74 m, el mas ancho del piso
    pose: {x: -7.25, y: 9.51, yaw: 0.0}
    holgura_m: 0.54

  - id: piso1_etm3
    nombre: "ETM3"
    nivel: 1
    es_transferencia: false
    lado_pared: norte        # vano de 0.60 m, casi enfrente de ETM13
    pose: {x: -7.82, y: 10.59, yaw: 0.0}
    holgura_m: 0.48

  - id: piso1_etm4
    nombre: "ETM4"
    nivel: 1
    es_transferencia: false
    lado_pared: norte        # vano de 0.60 m
    pose: {x: -6.62, y: 10.59, yaw: 0.0}
    holgura_m: 0.54

  - id: piso1_etm5
    nombre: "ETM5"
    nivel: 1
    es_transferencia: false
    lado_pared: norte        # vano de 0.54 m, el mas estrecho del piso
    pose: {x: -4.01, y: 10.59, yaw: 0.0}
    holgura_m: 0.48

  - id: piso1_etm6
    nombre: "ETM6"
    nivel: 1
    es_transferencia: false
    lado_pared: norte        # vano de 0.84 m
    pose: {x: 1.24, y: 10.59, yaw: 0.0}
    holgura_m: 0.48

  - id: piso1_etm11
    nombre: "ETM11"
    nivel: 1
    es_transferencia: false
    lado_pared: sur          # vano de 0.78 m
    pose: {x: 4.09, y: 9.51, yaw: 0.0}
    holgura_m: 0.60

  - id: piso1_etm7
    nombre: "ETM7"
    nivel: 1
    es_transferencia: false
    lado_pared: norte        # vano de 0.60 m
    pose: {x: 6.76, y: 10.59, yaw: 0.0}
    holgura_m: 0.48

  - id: piso1_etm8
    nombre: "ETM8"
    nivel: 1
    es_transferencia: false
    lado_pared: norte        # vano de 0.60 m
    pose: {x: 9.70, y: 10.59, yaw: 0.0}
    holgura_m: 0.48

  - id: piso1_almacen
    nombre: "Almacén ETM"
    nivel: 1
    es_transferencia: false
    lado_pared: sur          # vano de 0.60 m
    pose: {x: 15.16, y: 9.51, yaw: 0.0}
    holgura_m: 0.60

  - id: piso1_etm9
    nombre: "ETM9"
    nivel: 1
    es_transferencia: false
    lado_pared: norte        # vano de 0.60 m
    pose: {x: 18.10, y: 10.59, yaw: 0.0}
    holgura_m: 0.48

  # El vano del extremo este del pasillo, en el muro del fondo. Es el unico al
  # que se llega de frente y no por al lado, y su parada es la mas apretada del
  # archivo: el centro del vano esta a 0.45 m del muro norte, menos de los 0.70 m
  # que se le exigen al resto, asi que la parada queda 0.90 m antes de la puerta
  # y desplazada al sur. Conviene probar esta llegada antes de darla por buena.
  - id: piso1_etm10
    nombre: "ETM10"
    nivel: 1
    es_transferencia: false
    lado_pared: fondo        # vano de 0.66 m, centro en y = +10.65
    pose: {x: 19.27, y: 10.35, yaw: 0.0}
    holgura_m: 0.72

  # ==================================================================== PISO 2 --
  # Del piso 2 solo esta esto: el otro extremo del relevo. Los demas destinos
  # esperan a que las salas tengan nombre (ver LO QUE FALTA, arriba).
  #
  # DONDE ESTA LA ESCALERA, Y COMO SE SUPO
  # --------------------------------------
  # No se dedujo: la senalo Santiago sobre Gazebo el 2026-08-23, en
  # (-23.067, -9.104), y esta detras del arranque de robot2.
  #
  # Habia que preguntarlo porque los dos planos NO estan alineados. Los ejes de
  # los dos pasillos distan 14.50 m exactos en Y, y ese desfase sí transfiere:
  # aplicado a la escalera del piso 1 (y = +5.19) predice y = -9.31 contra los
  # -9.10 reales, 21 cm. Pero en X no transfiere nada -el piso 2 es 2.67 m mas
  # ancho por el oeste y 3.21 m por el este-, asi que la abscisa no se puede
  # calcular desde el piso 1.
  #
  # Y sobre todo: Documentos/mapa_destinos.txt tenia este hueco DESCARTADO. Su
  # vano 1, de 4.20 m, iba marcado 'N (boca abierta)' con la razon «no es un
  # vano, es donde se acaba el edificio». Lo que se acaba ahi es el dibujo, no el
  # edificio. Corregido en ese archivo el 2026-08-23.
  #
  # Encaja ademas con el arranque de los dos robots: robot1 nace a 1.41 m de
  # piso1_escalera y robot2 a 0.88 m de esta. Los dos esperan en su escalera.
  #
  # LA BARRERA (2026-08-23)
  # -----------------------
  # La boca de 4.24 m no era una pared que faltara: era el hueco por donde
  # suben las escaleras del piso 1. Un vacio. Ignorarlo no era opcion, porque
  # el LiDAR es plano y va a 0.16 m del suelo: un desnivel hacia ABAJO no
  # devuelve ningun rayo y el costmap lo lee como espacio libre planificable
  # hasta range_max. Nav2 habria trazado rutas por encima del hueco.
  #
  # Se cerro con el link 'Barrera_Escalera' de mundo_definitivo_piso2/
  # model.sdf: x = -23.07 -el punto que marco el autor en Gazebo, 32 cm al
  # este de donde acaban Wall_81 y Wall_88, que es la eleccion conservadora-,
  # de eje a eje de esas dos paredes, 2.5 m de alto, material Gazebo/Orange
  # para que no se confunda con geometria del edificio. Es la opcion C de
  # mapa_destinos.txt, que dejo de ser cara cuando cada piso paso a tener su
  # propio .world. Mapa regenerado el mismo dia con la receta grabada en su
  # .yaml: cobertura 100 %, 0 obstaculos sin pared real de 6306.
  #
  # LA PARADA
  # ---------
  # Con la barrera ya hay superficie contra la que localizar y se llega de
  # frente, como en ETM10. Pero el retiro NO es el de ETM10: son 1.50 m en
  # vez de 0.90. La razon es que al otro lado de esta cara no hay una pared
  # sino una caida, y en el carro real NO existe sensor de precipicio: la
  # proteccion es puramente simulada. Los 0.60 m extra absorben ademas la
  # incertidumbre de donde empieza exactamente el primer escalon, que no se
  # pudo medir.
  #
  # Comprobado sobre el .pgm regenerado: en (-21.50, -9.026) la holgura vale
  # 1.50 m y coincide al centimetro con la distancia a la cara de la barrera,
  # o sea que la restriccion activa es la barrera y no las paredes laterales,
  # que quedan a 2.12 m. y = -9.026 es el eje del ala. yaw = pi porque se
  # llega de frente desde el este.
  #
  # POR QUE SIGUE COMO provisional
  # ------------------------------
  # Ya no por la geometria, que quedo resuelta. Quedan dos cosas:
  #
  #   1. Le falta el nombre real, como al resto del piso 2.
  #   2. El cono ciego de 60 deg del LiDAR (R13) apunta justo a la barrera
  #      con yaw = pi: en la pose de llegada, la unica superficie nueva del
  #      mapa es precisamente la que el sensor no ve. Hay que medir si AMCL
  #      converge aqui antes de dar la pose por definitiva; la campana de S24
  #      la exige cerrada.
  - id: piso2_escalera
    nombre: "Escaleras"      # provisional: nombre real sin decidir
    nivel: 2
    es_transferencia: true
    provisional: true
    lado_pared: fondo        # se llega de frente contra Barrera_Escalera
    pose: {x: -21.50, y: -9.03, yaw: 3.1416}
    holgura_m: 1.50

  # --------------------------------------------------- PISO 2 - ALA NOROESTE --
  # Las dos primeras saliendo de la escalera. Ninguna esta en el pasillo largo:
  # la Division da a una pared que mira al oeste, y Lab. Sistemas 313 esta en
  # esquina (ver DOS DESVIACIONES en la cabecera).

  - id: piso2_division_ing_arq
    nombre: "División de Ing. y Arq."
    nivel: 2
    es_transferencia: false
    lado_pared: oeste        # vano de 1.32 m, centro en (-17.42, -1.70)
    pose: {x: -16.58, y: -1.70, yaw: 1.5708}
    holgura_m: 0.71

  - id: piso2_lab_313
    nombre: "Lab. Sistemas 313"
    nivel: 2
    es_transferencia: false
    lado_pared: norte        # vano de 0.60 m, centro en (-14.51, -0.95)
    pose: {x: -14.87, y: -1.73, yaw: 0.0}
    holgura_m: 0.71          # abscisa cedida: la parada queda a 0.86 m del vano

  # ------------------------------------------- PISO 2 - PASILLO LARGO (norte) --
  # De oeste a este, la ida del recorrido. Todas con yaw = 0, alineadas con el
  # pasillo, nunca apuntando a la puerta.

  - id: piso2_lab_312
    nombre: "Lab. Sistemas 312"

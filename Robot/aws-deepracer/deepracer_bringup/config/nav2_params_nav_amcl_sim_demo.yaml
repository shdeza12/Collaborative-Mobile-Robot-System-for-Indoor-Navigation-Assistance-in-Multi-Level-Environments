controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    progress_checker_plugin: "progress_checker"
    goal_checker_plugin: "goal_checker"
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    # POR QUE EL RUMBO NO DECIDE LA LLEGADA (R12, medido el 2026-08-24).
    #
    # Una mision real que abortó, con las dos cifras de la MISMA llegada:
    #
    #     destino ETM1 (-15.92, 10.59), yaw pedido 0.0
    #     /odom al parar (-16.302, 10.748)  ->  posicion 0.413 m   FUERA de 0.25
    #     yaw al parar    0.200 rad (11.4 deg) ->  rumbo    0.200  DENTRO de 0.25
    #
    # El carro venia de ETM10 rumbo OESTE (yaw ~ pi) y ETM1 pide ESTE (yaw 0):
    # 180 grados de diferencia. Con 'stateful: True' el SimpleGoalChecker, una vez
    # cumplida la tolerancia de posicion, DEJA DE COMPROBARLA y solo exige el
    # rumbo. Un Ackermann no gira sobre su eje, asi que la maniobra para cerrar
    # esos 180 grados lo ALEJO del punto -de menos de 0.25 m a 0.413 m- y Nav2
    # devolvio SUCCEEDED igual. Es el mismo patron del ETM13 del 21-ago
    # (SUCCEEDED a 0.296 m), pero aquella vez solo se tenia una de las dos cifras.
    #
    # Dos cambios, y son independientes:
    #
    #   stateful: False        la posicion se comprueba SIEMPRE, hasta el final.
    #                          Decidido el 22-ago en PROTOCOLO_EXPERIMENTAL.md §4
    #                          y no aplicado hasta hoy por falta de evidencia.
    #
    #   yaw_goal_tolerance     el rumbo final NO se impone. El robot queda
    #     3.15 (~pi)           apuntando hacia donde lo dejo la ruta, que es lo
    #                          util para guiar a una persona: llegar al sitio,
    #                          no aparcar en una direccion concreta. El 'yaw' de
    #                          puntos_interes.yaml pasa a ser orientativo.
    #
    # QUE NO CAMBIA, Y ES LO QUE HACE LEGITIMO EL CAMBIO. El criterio de exito
    # sigue siendo 0.25 m contra /odom, el mismo de antes de ver estos datos. Aqui
    # se cambia lo que se le PIDE a Nav2, no el listón con el que se le mide. El
    # protocolo se escribio antes de instrumentar justamente para que un umbral no
    # se elija viendo los resultados; ese umbral sigue intacto.
    # POR QUE 0.15 Y NO 0.25 (medido el 2026-08-27, bag S20_rutas_01).
    #
    # Estaba en 0.25, el MISMO numero con el que el coordinador decide si la
    # llegada vale. Eso deja margen cero, y el fallo es aritmetico: Nav2 para en
    # cuanto SU ESTIMACION baja de 0.25, o sea tipicamente a 0.24, y el
    # coordinador mide contra /odom, que es la verdad. Cualquier error de
    # localizacion en ese instante hace fallar la mision.
    #
    # Capturado en el instante exacto de la decision:
    #
    #     t+23.0 s  Nav2 se creia en (-18.875, 6.167) -> 0.240 m, DENTRO
    #               estaba de verdad en (-18.866, 6.225) -> 0.297 m, FUERA
    #               error de localizacion en ese instante: 0.058 m
    #
    # Y no es mala suerte: es lo que ese diseno produce siempre. El acercamiento
    # maximo fue 0.296 m, el mismo numero del ETM13 del 21-ago que se cita mas
    # arriba, y el mismo patron del 0.316 m con el que se cerro esta mision.
    #
    # El presupuesto, con los alpha ya corregidos (ver la nota de amcl):
    #     0.150  parada
    #   + 0.065  error de AMCL previsto a 42.17 m
    #   + 0.023  desfase del fin del plan por resolucion de rejilla
    #   = 0.238  por debajo de los 0.25 del criterio
    #
    # Otra vez: se cambia lo que se le PIDE a Nav2, no el liston con el que se
    # le mide. Si 0.15 resulta inalcanzable para un Ackermann, el
    # SimpleProgressChecker abortara a los 10 s sin moverse 0.5 m; eso seria un
    # fallo honesto y no un falso exito, y el siguiente escalon seria 0.18.
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 3.15
      stateful: False
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.5
      lookahead_dist: 0.6
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      transform_tolerance: 0.1
      use_velocity_scaled_lookahead_dist: false
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      # Radio minimo fisico del vehiculo = distancia_entre_ejes / tan(max_steer)
      #                                  = 0.164 m / tan(0.5236 rad) = 0.284 m
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.25
      # Ackermann: el vehiculo no puede girar sobre su propio eje.
      # Con use_rotate_to_heading habilitado, RPP comanda velocidad angular pura
      # y el vehiculo queda inmovil. Debe permanecer en false.
      use_rotate_to_heading: false
      # Debe ir acompanado de use_rotate_to_heading: false (RPP lo exige en Humble).
      allow_reversing: true
      cost_scaling_dist: 0.3
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 3.0

controller_server_rclcpp_node:
  ros__parameters:
    use_sim_time: True

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: True
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      footprint: '[[0.140, 0.095], [0.140, -0.095], [-0.140, -0.095], [-0.140, 0.095]]'
      plugins: ["voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 2.0
          raytrace_min_range: 0.0
          obstacle_max_range: 1.5
          obstacle_min_range: 0.0
      static_layer:
        map_subscribe_transient_local: True
      always_send_full_costmap: True
  local_costmap_client:
    ros__parameters:
      use_sim_time: True
  local_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: True
      

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: True
      footprint: '[[0.140, 0.095], [0.140, -0.095], [-0.140, -0.095], [-0.140, 0.095]]'
      resolution: 0.06   # debe coincidir con la resolucion del mapa (primer_piso_definitivo.yaml)
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 2.5
          raytrace_min_range: 0.0
          obstacle_max_range: 2.0
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      always_send_full_costmap: True
  global_costmap_client:
    ros__parameters:
      use_sim_time: True
  global_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: True

planner_server:
  ros__parameters:
    planner_plugins: ["GridBased"]
    use_sim_time: True

    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      tolerance: 0.5                    # tolerance for planning if unable to reach exact pose, in meters, for 2D node
      downsample_costmap: false         # whether or not to downsample the map
      downsampling_factor: 1            # multiplier for the resolution of the costmap layer (e.g. 2 on a 5cm costmap would be 10cm)
      allow_unknown: false              # allow traveling in unknown space
      max_iterations: -1                # maximum total iterations to search for before failing
      max_on_approach_iterations: 1000  # maximum number of iterations to attempt to reach goal once in tolerance, 2D only
      max_planning_time: 2.0            # max time in s for planner to plan, smooth, and upsample. Will scale maximum smoothing and upsampling times based on remaining time after planning.
      smooth_path: false                # Whether to smooth searched path
      # Ackermann: REEDS_SHEPP habilita primitivas de marcha atras, necesarias para
      # invertir el sentido de marcha en pasillo (maniobra en varios tiempos).
      # Con DUBIN (solo avance) el planificador genera rutas que el controlador no
      # puede seguir cuando el objetivo queda detras del vehiculo.
      motion_model_for_search: "REEDS_SHEPP"
      angle_quantization_bins: 72       # For SE2 node: Number of angle bins for search, must be 1 for 2D node (no angle search)
      minimum_turning_radius: 0.35      # For SE2 node & smoother: minimum turning radius in m of path / vehicle
      reverse_penalty: 2.1              # For Reeds-Shepp model: penalty to apply if motion is reversing, must be => 1
      change_penalty: 0.20              # For SE2 node: penalty to apply if motion is changing directions, must be >= 0
      non_straight_penalty: 1.05        # For SE2 node: penalty to apply if motion is non-straight, must be => 1
      cost_penalty: 1.3                 # For SE2 node: penalty to apply to higher cost zones

      smoother:
        smoother:
          w_curve: 30.0                 # weight to minimize curvature of path
          w_dist: 0.0                   # weight to bind path to original as optional replacement for cost weight
          w_smooth: 30000.0             # weight to maximize smoothness of path
          w_cost: 0.025                 # weight to steer robot away from collision and cost
          cost_scaling_factor: 10.0     # this should match the inflation layer's parameter
        optimizer:
          max_time: 0.10                # maximum compute time for smoother
          max_iterations: 500           # max iterations of smoother
          debug_optimizer: false        # print debug info
          gradient_tol: 1.0e-10
          fn_tol: 1.0e-20
          param_tol: 1.0e-15
          advanced:
            min_line_search_step_size: 1.0e-20
            max_num_line_search_step_size_iterations: 50
            line_search_sufficient_function_decrease: 1.0e-20
            max_num_line_search_direction_restarts: 10
            max_line_search_step_expansion: 50

planner_server_rclcpp_node:
  ros__parameters:
    use_sim_time: True

robot_state_publisher:
  ros__parameters:
    use_sim_time: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    # 'spin' se mantiene registrado porque el bt_navigator exige que el action
    # server exista al cargar los arboles. La exclusion de la maniobra de giro en
    # sitio se hace en los arboles Ackermann (behavior_trees/), no aqui.
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_link
    transform_timeout: 0.1
    use_sim_time: True
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"   
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

amcl:
  ros__parameters:
    use_sim_time: True
    set_initial_pose: true
    # AMCL declara CUATRO parametros sueltos ('initial_pose.x', '.y', '.z',
    # '.yaw'), no una lista. Aqui habia 'initial_pose: [0.0, 0.0, 0.0]', que no
    # corresponde a ningun parametro declarado y que ROS descartaba sin avisar:
    # 'ros2 param get /amcl initial_pose' respondia 'Parameter not set'. Pasaba
    # inadvertido porque el valor por defecto ya era cero y el robot nace en el
    # origen; con un robot lanzado en otra pose la linea seguiria sin hacer nada.
    #
    # Estos valores los reescribe deepracer_localization_sim.launch.py con los
    # argumentos x/y/yaw del spawn. Los de aqui son solo el caso por defecto.
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0
    # RUIDO DEL MODELO DE MOVIMIENTO (medido el 2026-08-27, S20_localizacion).
    #
    # Estaban en 0.2, o sea declarandole a AMCL un 20 % de ruido de odometria.
    # En SIMULACION eso es falso por construccion: /odom no es odometria, es la
    # pose del mundo de Gazebo (gazebo_ros_deepracer_drive.cpp:229). Comprobado
    # muestreando a la vez 'gz model -m robot1 -p' y /robot1/odom: coinciden en
    # ~1 mm, y ese milimetro es el propio deslizamiento entre una muestra y la
    # siguiente. El ruido real es CERO.
    #
    # Lo que costaba. En un pasillo recto el laser ve dos paredes paralelas:
    # fija la posicion lateral y no dice NADA de la longitudinal, porque el
    # pasillo es identico a lo largo. Sin esa correccion, el ruido que
    # inyectaban los alpha se acumulaba en un paseo aleatorio sobre X. Medido en
    # las tres misiones de S20_localizacion, que arrancaron limpias (error
    # inicial 0.008-0.020 m) y terminaron a 1.03, 1.43 y 1.03 m:
    #
    #     error casi todo en X (hasta 1.4 m), Y siempre en 0.01-0.04 m
    #     crecimiento 0.024, 0.036 y 0.033 m por metro recorrido (media 0.031)
    #     desplome a ~0.09 m a los 42 m en las tres, al llegar al extremo del
    #       pasillo y ver por fin geometria distinta
    #
    # A 0.031 m/m, la mision mas larga del piso 1 (42.17 m) acumulaba 1.30 m de
    # error: era imposible de aprobar contra el criterio de 0.25 m antes de
    # empezar. Con alpha 0.01 la prediccion baja a 0.065 m.
    #
    # ESTO NO ES AJUSTAR EL LISTON A LOS RESULTADOS. El criterio de exito sigue
    # siendo 0.25 m contra /odom. Aqui se corrige un parametro que describia MAL
    # el sistema -20 % de ruido en una fuente medida exacta al milimetro-, y esa
    # correccion se justifica sola, sin mirar ningun resultado de llegada.
    #
    # EN EL CARRO FISICO NO VALEN. Alli /odom si es odometria de encoders y los
    # alpha hay que medirlos sobre el carro. Este fichero es el _sim_demo.
    alpha1: 0.01
    alpha2: 0.01
    alpha3: 0.01
    alpha4: 0.01
    alpha5: 0.01
    base_frame_id: "base_link"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 100.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.2
    update_min_d: 0.25
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: scan

amcl_map_client:
  ros__parameters:
    use_sim_time: True

amcl_rclcpp_node:
  ros__parameters:
    use_sim_time: True

map_server:
  ros__parameters:
    use_sim_time: True
    yaml_filename: primer_piso_definitivo.yaml   # sobreescrito por el argumento map:= del launch
    # Marco con el que se sella el OccupancyGrid. Tiene que estar ESCRITO aqui
    # aunque el launch lo reescriba: RewrittenYaml recorre las claves que ya
    # existen (pathify) y una clave que no esta en el YAML se ignora sin avisar.
    # Bajo namespace pasa a 'robotN/map' (ver deepracer_localization_sim.launch.py).
    frame_id: map

